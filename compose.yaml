# pkgsitex 本地启动 —— 索引平级 clone 在 ~/Repo/<name> 下的内部 Go module。
#
# 使用：
#     cd ~/Repo/pkgsitex
#     docker compose up -d
#     open http://localhost:8089/pkgsitex/
#
# 不需要 ~/Repo/pkgsitex 自身平级——pkgsitex repo 是 build context 自己。其他
# 内部仓库（Chat / UniAuth / open-platform / Doubao-Speech-Service 等）需要
# 已 clone 到 ~/Repo/ 下，相对路径 ../<name> mount 进容器。
#
# 增 / 减仓库：
#   1) volumes: 加一行 ../<name>:/repos/<name>:ro
#   2) command: 末尾加 /repos/<name>
#
# 本地有 Go toolchain 时直接 `go run ./cmd/pkgsite -base-path=... <paths>`
# 比 docker 启动快 10 倍——docker 适合给没 Go toolchain 的同事用，或者
# 想跟其他 service（mssql / redis / 业务 backend）一起编排时。
#
# Prod 部署是另一回事：cmd/frontend + cmd/worker + Postgres 三件套，配置
# 文件驱动 + GitHub PAT 拉私有 repo + license 放行——见 docs/PROD_DEPLOY.md
# （TODO，下一阶段做）。

services:
  pkgsitex:
    build:
      context: .
    image: pkgsitex:local
    container_name: pkgsitex
    ports:
      - "8089:8080"
    volumes:
      # mount 公司内部 Go module 仓库（约定 ~/Repo/<name>，docker-compose 的
      # working dir 是本 yaml 所在目录，相对 .. 就是 ~/Repo/）
      - ../Chat:/repos/chat:ro
      - ../Doubao-Speech-Service:/repos/doubao-speech-service:ro
      # UniAuth 是 monorepo 含两个 Go module，分别 mount——pkgsite 不支持
      # nested module 自动发现
      - ../UniAuth/uniauth-gf:/repos/uniauth-gf:ro
      - ../UniAuth/ittools_sync:/repos/ittools_sync:ro
      - ../open-platform:/repos/open-platform:ro
    command:
      - "-base-path=/pkgsitex"
      - "-show-unexported"
      - "-http=:8080"
      # mount 进来的 module path 全列出来——pkgsite 不会自动发现 /repos/ 下
      # 多 module，需要显式列。增减仓库时跟上面 volumes: 同步改
      - "/repos/chat"
      - "/repos/doubao-speech-service"
      - "/repos/uniauth-gf"
      - "/repos/ittools_sync"
      - "/repos/open-platform"
    restart: unless-stopped
